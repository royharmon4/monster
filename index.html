<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Battle — Preview v3</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1221; --panel: #171b2f; --panel-2: #1e2440;
      --text: #f5f7ff; --muted: #b1bad7; --accent: #7c8cff;
      --accent-2: #8ef2cf; --danger: #ff6f7f; --warning: #ffd166;
      --line: rgba(255,255,255,0.08); --shadow: 0 16px 40px rgba(0,0,0,0.28);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; background:radial-gradient(circle at top,#1c2445 0%,var(--bg) 45%); color:var(--text); }
    button,input { font:inherit; }
    button { border:none; border-radius:14px; padding:0.85rem 1rem; font-weight:700; background:var(--accent); color:white; cursor:pointer; box-shadow:var(--shadow); transition:opacity 120ms ease,transform 120ms ease; }
    button.ghost { background:rgba(255,255,255,0.06); color:var(--text); box-shadow:none; border:1px solid var(--line); }
    button.danger { background:var(--danger); }
    button:disabled { opacity:0.45; cursor:not-allowed; }
    button:active:not(:disabled) { opacity:0.65; transform:scale(0.97); }
    .shell { width:min(1080px,calc(100% - 24px)); margin:0 auto; padding:20px 0 40px; }
    .topbar,.section-header,.monster-header,.row { display:flex; align-items:center; justify-content:space-between; }
    .wrap { flex-wrap:wrap; }
    .topbar { gap:1rem; margin-bottom:1rem; }
    .topbar-actions { display:flex; align-items:center; gap:0.75rem; }
    .card { background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01)); border:1px solid var(--line); border-radius:var(--radius); padding:1rem; box-shadow:var(--shadow); }
    .stack { display:grid; }
    .gap-sm { gap:0.5rem; } .gap-md { gap:0.85rem; } .gap-lg { gap:1rem; }
    .eyebrow { text-transform:uppercase; letter-spacing:0.12em; color:var(--accent-2); font-size:0.72rem; margin:0 0 0.25rem; }
    h1,h2,h3,p { margin:0; }
    .muted { color:var(--muted); }
    .hidden { display:none !important; }
    .pill { display:inline-flex; align-items:center; gap:0.35rem; border-radius:999px; padding:0.35rem 0.7rem; background:rgba(124,140,255,0.18); border:1px solid rgba(124,140,255,0.35); font-size:0.84rem; }
    .pill.muted { background:rgba(255,255,255,0.06); border-color:var(--line); }
    .preview-badge { display:inline-flex; align-items:center; gap:0.4rem; border-radius:999px; padding:0.3rem 0.75rem; background:rgba(255,209,102,0.15); border:1px solid rgba(255,209,102,0.35); color:var(--warning); font-size:0.78rem; font-weight:600; }

    .monster-stage { margin-top:0.5rem; display:grid; grid-template-columns:min(260px,40%) 1fr; gap:0.75rem; }
    .monster-art { background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02)); border-radius:18px; border:1px solid var(--line); min-height:180px; display:grid; place-items:center; padding:0.4rem; }
    .monster-art svg { width:min(100%,220px); height:auto; overflow:visible; filter:drop-shadow(0 14px 20px rgba(0,0,0,0.28)); transition:transform 400ms ease, filter 400ms ease; }
    .monster-art.hurt      svg { transform:rotate(-4deg); filter:drop-shadow(0 14px 20px rgba(0,0,0,0.28)) saturate(0.8); }
    .monster-art.badly-hurt svg { transform:rotate(-9deg) translateY(6px); filter:drop-shadow(0 14px 20px rgba(0,0,0,0.28)) saturate(0.5) brightness(0.85); animation:wooze 2.4s ease-in-out infinite; }
    @keyframes wooze { 0%,100%{transform:rotate(-9deg) translateY(6px)} 50%{transform:rotate(-6deg) translateY(3px)} }
    .hp-row,.pill-row { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; }
    .hp-bar { width:100%; height:18px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; }
    .hp-fill { height:100%; width:0; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width 260ms ease; }

    .final-blow-panel { padding:1rem; border-radius:18px; border:1px solid rgba(255,209,102,0.28); background:linear-gradient(180deg,rgba(255,209,102,0.14),rgba(255,209,102,0.08)); display:grid; gap:0.85rem; }
    .final-blow-buttons { display:flex; flex-wrap:wrap; gap:0.75rem; }
    .final-blow-btn { background:linear-gradient(135deg,var(--danger),#c0392b); font-size:1rem; animation:finalPulse 1.4s ease-in-out infinite; }
    @keyframes finalPulse { 0%,100%{box-shadow:0 0 20px rgba(255,111,127,0.3)} 50%{box-shadow:0 0 50px rgba(255,111,127,0.8)} }
    .final-blow-note { color:var(--muted); font-size:0.95rem; }

    /* ── DEATH SEQUENCE ── */
    /* Shockwave rings */
    .shockwave { position:fixed; pointer-events:none; z-index:210; border-radius:50%; border:4px solid rgba(255,255,255,0.9); animation:shockwaveExpand 600ms cubic-bezier(.2,.6,.4,1) forwards; }
    @keyframes shockwaveExpand { 0%{opacity:1;transform:translate(-50%,-50%) scale(0)} 60%{opacity:0.6} 100%{opacity:0;transform:translate(-50%,-50%) scale(6)} }

    /* Particles */
    .burst-particle { position:fixed; pointer-events:none; z-index:211; border-radius:50%; animation:particleFly var(--dur,700ms) cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes particleFly { 0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(0.2)} }

    /* DEFEATED stamp */
    .death-stamp { position:fixed; pointer-events:none; z-index:212; font-size:clamp(2.5rem,8vw,5rem); font-weight:900; letter-spacing:0.12em; text-transform:uppercase; color:var(--danger); text-shadow:0 0 40px rgba(255,111,127,0.8),0 0 10px rgba(255,111,127,0.5),0 4px 20px rgba(0,0,0,0.8); animation:stampIn 800ms cubic-bezier(.18,.8,.3,1.2) forwards; white-space:nowrap; }
    @keyframes stampIn { 0%{opacity:0;transform:translate(-50%,-50%) scale(2.5) rotate(-8deg);filter:blur(8px)} 30%{opacity:1;transform:translate(-50%,-50%) scale(0.9) rotate(2deg);filter:blur(0)} 50%{transform:translate(-50%,-50%) scale(1.04) rotate(-1deg)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)} }

    /* Vignette */
    .death-vignette { position:fixed; inset:0; pointer-events:none; z-index:209; background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.75) 100%); animation:vigIn 500ms ease forwards; }
    @keyframes vigIn { from{opacity:0} to{opacity:1} }

    /* X eyes overlay on monster */
    .monster-art.dead-eyes svg .x-eyes { animation:xEyesPop 300ms cubic-bezier(.3,.8,.4,1.4) forwards; }
    @keyframes xEyesPop { from{opacity:0;transform:scale(0)} to{opacity:1;transform:scale(1)} }
    .monster-art.is-dead { filter:grayscale(0.7) brightness(0.7); transition:filter 400ms ease; }

    /* Tap to continue */
    .tap-continue { position:fixed; inset:0; z-index:215; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10vh; cursor:pointer; }
    .tap-continue span { font-size:1rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.7); animation:tapPulse 1.2s ease-in-out infinite; }
    @keyframes tapPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

    /* Victory modal */
    .victory-banner { position:fixed; inset:0; background:rgba(5,7,18,0.92); backdrop-filter:blur(8px); display:grid; place-items:center; z-index:300; padding:1rem; animation:bannerReveal 400ms cubic-bezier(.3,.8,.4,1) forwards; }
    @keyframes bannerReveal { from{opacity:0} to{opacity:1} }
    .victory-inner { position:relative; overflow:hidden; background:linear-gradient(160deg,#1a1f3a,#0f1221); border:1px solid rgba(142,242,207,0.25); border-radius:var(--radius); padding:2.5rem 2rem; max-width:520px; width:100%; text-align:center; box-shadow:0 0 0 1px rgba(142,242,207,0.08),0 40px 80px rgba(0,0,0,0.7),0 0 80px rgba(142,242,207,0.06); animation:innerPop 500ms 200ms cubic-bezier(.2,.8,.3,1.1) both; }
    @keyframes innerPop { from{opacity:0;transform:scale(0.82) translateY(24px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .victory-inner::before { content:''; position:absolute; top:0; left:-100%; width:200%; height:2px; background:linear-gradient(90deg,transparent,var(--accent-2),transparent); animation:shimmer 1.2s 600ms ease forwards; }
    @keyframes shimmer { from{left:-100%} to{left:100%} }
    .victory-trophy { font-size:3.5rem; line-height:1; animation:trophyBounce 600ms 400ms cubic-bezier(.3,.8,.4,1.4) both; }
    @keyframes trophyBounce { from{opacity:0;transform:scale(0) rotate(-20deg)} to{opacity:1;transform:scale(1) rotate(0)} }
    .victory-inner h2 { font-size:2rem; margin:0.4rem 0 0.75rem; color:var(--accent-2); line-height:1.2; }
    .victory-inner .v-line { font-size:1.05rem; color:var(--text); margin-bottom:0.5rem; }
    .v-hero { color:var(--accent-2); font-weight:700; }
    .v-dmg  { color:var(--warning); font-weight:800; }
    .victory-actions { display:flex; gap:0.75rem; justify-content:center; margin-top:1.5rem; flex-wrap:wrap; }
    .victory-actions button { min-width:140px; }

    .battle-layout { display:grid; grid-template-columns:1fr; gap:1rem; }
    @media (min-width:600px) { .battle-layout { grid-template-columns:1.1fr 1fr; } }
    .kid-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0.4rem; margin-top:0; }
    .kid-btn { background:var(--panel-2); border:1px solid var(--line); padding:0.65rem 0.4rem; text-align:center; min-width:0; }
    .kid-btn strong { display:block; font-size:clamp(0.8rem,3vw,1rem); white-space:nowrap; }
    .kid-btn.selected { border-color:var(--accent); outline:2px solid rgba(124,140,255,0.32); }
    .kid-btn small,.leaderboard-card small { display:block; margin-top:0.25rem; color:var(--muted); font-weight:500; }
    .move-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0.75rem; }
    .move-btn { min-height:92px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:0.3rem; }
    .move-btn.grenade { background:linear-gradient(135deg,#ff8a5b,#ff4d6d); }
    .hit-panel { display:grid; gap:0.75rem; }
    .lb-tabs { display:flex; gap:0.3rem; }
    .lb-tab { padding:0.3rem 0.65rem; font-size:0.78rem; font-weight:600; border-radius:999px; background:transparent; color:var(--muted); box-shadow:none; border:1px solid transparent; transition:all 150ms ease; }
    .lb-tab:hover { color:var(--text); }
    .lb-tab.active { background:rgba(124,140,255,0.18); border-color:rgba(124,140,255,0.35); color:var(--accent); box-shadow:none; }
    .leaderboard { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0.75rem; }
    /* ── HIT BUTTON ── */
    .hit-btn {
      min-height:120px; font-size:1.4rem; letter-spacing:0.06em;
      position:relative; overflow:hidden;
      background:linear-gradient(135deg,#6a7bff,#8c5cf7);
      transition:transform 100ms ease, box-shadow 100ms ease, opacity 120ms ease;
    }
    .hit-btn:hover:not(:disabled){ transform:scale(1.02); box-shadow:0 0 36px rgba(124,140,255,0.5); }
    .hit-btn:active:not(:disabled){ transform:scale(0.93); }
    .hit-btn::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at center,rgba(255,255,255,0.35) 0%,transparent 65%); opacity:0; border-radius:14px; }
    @keyframes rippleOut{ 0%{opacity:1;transform:scale(0.1)} 100%{opacity:0;transform:scale(2.8)} }
    .hit-btn.do-ripple::after{ animation:rippleOut 380ms ease forwards; }

    /* ── HP BAR FLASH ── */
    .hp-fill{ transition:width 320ms cubic-bezier(.4,0,.2,1),background 400ms ease; }
    .hp-fill.low{ background:linear-gradient(90deg,#ff9f68,var(--danger)); }
    @keyframes hpFlash{ 0%{filter:brightness(1)} 40%{filter:brightness(2.4)} 100%{filter:brightness(1)} }
    .hp-fill.do-flash{ animation:hpFlash 220ms ease; }

    /* ── BATTLE FEED FLASH ── */

    /* ── SCREEN FLASH ── */
    .screen-flash{ position:fixed; inset:0; pointer-events:none; z-index:199; animation:sFlash 380ms ease forwards; }
    .screen-flash.normal{ background:rgba(142,242,207,0.09); }
    .screen-flash.crit  { background:rgba(255,209,102,0.2); }
    @keyframes sFlash{ 0%{opacity:1} 100%{opacity:0} }

    /* ── MONSTER SHAKE ── */
    @keyframes mHit{
      0%{transform:translate(0,0) rotate(0)} 14%{transform:translate(-11px,0) rotate(-3deg)}
      28%{transform:translate(11px,0) rotate(3deg)} 42%{transform:translate(-7px,0) rotate(-2deg)}
      56%{transform:translate(7px,0) rotate(2deg)} 72%{transform:translate(-3px,0) rotate(-1deg)}
      100%{transform:translate(0,0) rotate(0)}
    }
    @keyframes mCrit{
      0%{transform:translate(0,0) scale(1) rotate(0)} 8%{transform:translate(-15px,5px) scale(0.9) rotate(-6deg)}
      22%{transform:translate(15px,-5px) scale(1.08) rotate(6deg)} 36%{transform:translate(-10px,3px) scale(0.97) rotate(-3deg)}
      50%{transform:translate(9px,-2px) scale(1.02) rotate(2deg)} 65%{transform:translate(-4px,0) scale(1) rotate(-1deg)}
      100%{transform:translate(0,0) scale(1) rotate(0)}
    }
    .monster-art svg.do-shake     { animation:mHit  520ms ease; transform-origin:center bottom; }
    .monster-art svg.do-shake-crit{ animation:mCrit 640ms ease; transform-origin:center bottom; }

    /* ── MONSTER ART OVERLAY FLASH ── */
    .monster-art{ position:relative; overflow:visible; }
    .monster-art::after{ content:''; position:absolute; inset:0; border-radius:18px; pointer-events:none; opacity:0; }
    .monster-burn-mark{ position:absolute; width:84px; height:44px; left:50%; top:58%; transform:translate(-50%,-50%) rotate(-10deg) scale(0.6); border-radius:50%; background:radial-gradient(circle at center, rgba(12,8,7,0.86) 0%, rgba(50,24,18,0.68) 35%, rgba(255,120,64,0.22) 60%, rgba(255,120,64,0) 100%); mix-blend-mode:multiply; filter:blur(1px); opacity:0; pointer-events:none; }
    .monster-burn-mark.active{ animation:burnMarkAppear 650ms ease forwards; }
    @keyframes burnMarkAppear{ 0%{opacity:0; transform:translate(-50%,-58%) rotate(-16deg) scale(0.2)} 55%{opacity:0.85; transform:translate(-50%,-50%) rotate(-8deg) scale(1.08)} 100%{opacity:0.72; transform:translate(-50%,-50%) rotate(-10deg) scale(1)} }
    .grenade-projectile{ position:fixed; width:26px; height:26px; border-radius:50%; z-index:205; pointer-events:none; background:radial-gradient(circle at 35% 35%, #9aa4b2 0%, #55606f 55%, #1b222c 100%); border:2px solid rgba(255,255,255,0.18); box-shadow:0 0 18px rgba(255,140,100,0.35); animation:grenadeFlight 720ms cubic-bezier(.2,.75,.3,1) forwards; }
    .grenade-projectile::before{ content:''; position:absolute; width:10px; height:10px; border-radius:4px; background:#2d333b; top:-5px; left:8px; transform:rotate(24deg); }
    .grenade-projectile::after{ content:''; position:absolute; width:28px; height:28px; left:12px; top:-8px; background:radial-gradient(circle, rgba(255,219,120,0.95) 0%, rgba(255,147,85,0.7) 35%, rgba(255,147,85,0) 75%); filter:blur(1px); animation:fuseFlicker 180ms steps(2) infinite; }
    @keyframes grenadeFlight{ 0%{opacity:0; transform:translate(var(--start-x),var(--start-y)) scale(0.6) rotate(-20deg)} 8%{opacity:1} 55%{transform:translate(calc(var(--start-x) + var(--delta-x) * 0.55), calc(var(--start-y) + var(--delta-y) * 0.55 - 110px)) scale(1) rotate(180deg)} 100%{opacity:1; transform:translate(calc(var(--start-x) + var(--delta-x)), calc(var(--start-y) + var(--delta-y))) scale(1.08) rotate(390deg)} }
    @keyframes fuseFlicker{ from{transform:scale(0.85); opacity:0.6} to{transform:scale(1.1); opacity:1} }
    .grenade-explosion{ position:fixed; width:34px; height:34px; border-radius:50%; z-index:206; pointer-events:none; background:radial-gradient(circle, rgba(255,248,210,1) 0%, rgba(255,179,82,0.95) 30%, rgba(255,93,64,0.82) 55%, rgba(98,26,16,0.18) 80%, rgba(98,26,16,0) 100%); box-shadow:0 0 40px rgba(255,148,93,0.6); animation:grenadeExplosion 620ms cubic-bezier(.16,.84,.34,1) forwards; }
    .grenade-explosion::before, .grenade-explosion::after{ content:''; position:absolute; inset:-16px; border-radius:50%; border:3px solid rgba(255,186,122,0.55); animation:explosionRing 620ms ease-out forwards; }
    .grenade-explosion::after{ inset:-28px; animation-delay:60ms; }
    @keyframes grenadeExplosion{ 0%{opacity:0; transform:translate(-50%,-50%) scale(0.2)} 18%{opacity:1; transform:translate(-50%,-50%) scale(2.8)} 100%{opacity:0; transform:translate(-50%,-50%) scale(4.4)} }
    @keyframes explosionRing{ from{opacity:0.9; transform:scale(0.3)} to{opacity:0; transform:scale(1.5)} }
    .ember-particle{ position:fixed; width:8px; height:8px; border-radius:50%; z-index:207; pointer-events:none; background:radial-gradient(circle, #ffd166 0%, #ff7b54 55%, rgba(91,18,11,0.2) 100%); box-shadow:0 0 14px rgba(255,129,84,0.7); animation:emberBurst var(--dur,900ms) ease-out forwards; }
    @keyframes emberBurst{ 0%{opacity:1; transform:translate(-50%,-50%) translate(0,0) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(0.2)} }
    @keyframes artFlash{ 0%{opacity:1} 100%{opacity:0} }
    .monster-art.do-flash-art::after     { background:rgba(255,255,255,0.22); animation:artFlash 300ms ease forwards; }
    .monster-art.do-flash-art-crit::after{ background:rgba(255,209,102,0.32); animation:artFlash 450ms ease forwards; }

    /* ── FLOATING DAMAGE NUMBER ── */
    .dmg-float{ position:fixed; pointer-events:none; font-weight:900; line-height:1; z-index:200; text-shadow:0 2px 14px rgba(0,0,0,0.7); animation:dmgRise 950ms cubic-bezier(.18,.82,.4,1) forwards; user-select:none; white-space:nowrap; }
    .dmg-float.normal{ color:#fff; font-size:2.6rem; }
    .dmg-float.crit  { color:var(--warning); font-size:3.8rem; }
    @keyframes dmgRise{
      0%  { opacity:1; transform:translate(-50%,0) scale(1.3); }
      12% { opacity:1; transform:translate(-50%,-18px) scale(1); }
      65% { opacity:1; transform:translate(-50%,-80px) scale(0.9); }
      100%{ opacity:0; transform:translate(-50%,-118px) scale(0.8); }
    }

    /* ── CRIT BURST ── */
    .crit-burst{ position:fixed; pointer-events:none; z-index:201; display:flex; flex-direction:column; align-items:center; gap:0.15rem; animation:burstPop 1050ms cubic-bezier(.2,.8,.35,1) forwards; }
    .crit-burst .crit-word{ font-size:3.2rem; font-weight:900; letter-spacing:0.1em; color:var(--warning); text-shadow:0 0 30px rgba(255,209,102,0.9),0 0 8px rgba(255,209,102,0.6),0 3px 12px rgba(0,0,0,0.6); }
    .crit-burst .crit-sub { font-size:1rem; font-weight:800; letter-spacing:0.22em; color:#fff; opacity:0.9; text-transform:uppercase; }
    @keyframes burstPop{
      0%  { opacity:0; transform:translate(-50%,-50%) scale(0.3) rotate(-10deg); }
      10% { opacity:1; transform:translate(-50%,-50%) scale(1.22) rotate(4deg); }
      22% { opacity:1; transform:translate(-50%,-50%) scale(0.94) rotate(-2deg); }
      55% { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
      100%{ opacity:0; transform:translate(-50%,-50%) scale(0.88) rotate(0deg); }
    }

    @media (max-width:820px) {
      .monster-stage,.battle-layout,.leaderboard { grid-template-columns:1fr; }
      .kid-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .move-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .shell { padding: 12px 0 40px; }
      .topbar { flex-wrap: wrap; }
    }
    .leaderboard-card { border-radius:16px; background:var(--panel-2); border:1px solid var(--line); padding:0.95rem; }
    .score-row { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.4rem; }
    .score-chip { display:inline-flex; align-items:center; gap:0.35rem; padding:0.32rem 0.6rem; border-radius:999px; background:rgba(255,255,255,0.06); border:1px solid var(--line); color:var(--muted); font-size:0.85rem; }
    .score-chip-kills { background:rgba(255,111,127,0.15); border-color:rgba(255,111,127,0.4); color:var(--danger); }
    .log-list { display:grid; gap:0.65rem; }
    .log-item { border-radius:14px; border:1px solid var(--line); padding:0.85rem 0.95rem; background:rgba(255,255,255,0.03); }
    .log-item strong { color:var(--accent-2); }
    .log-item.is-crit { border-color:rgba(255,209,102,0.4); background:rgba(255,209,102,0.05); }
    .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:999; min-width:min(92vw,360px); max-width:min(92vw,480px); padding:0.9rem 1rem; border-radius:16px; background:rgba(22,27,47,0.96); border:1px solid rgba(255,255,255,0.12); box-shadow:var(--shadow); text-align:center; }
    .toast.success { border-color:rgba(142,242,207,0.32); }
    .toast.warning { border-color:rgba(255,209,102,0.35); }
    .leaderboard-header { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap; }
    .leaderboard-controls { display:flex; align-items:center; gap:0.65rem; flex-wrap:wrap; justify-content:flex-end; }
    .bottom-reset { display:flex; justify-content:center; gap:0.75rem; padding-top:0.25rem; flex-wrap:wrap; }
    .bottom-reset button { width:min(100%,320px); }
  </style>
</head>
<body>
<div id="app" class="shell">
  <header class="topbar">
    <h1 id="appTitle">Boss Battle</h1>
    <div class="topbar-actions">
      <button id="saveBtn" class="ghost" type="button" title="Save progress to file">💾 Save</button>
      <label class="ghost" style="display:inline-flex;align-items:center;border-radius:14px;padding:0.85rem 1rem;font-weight:700;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--line);cursor:pointer;font:inherit;" title="Load progress from file">📂 Load<input id="loadInput" type="file" accept=".json" style="display:none"/></label>
      <button id="healMonsterBtn" class="ghost" type="button">+5 HP</button>
      <button id="resetBattleBtn" class="danger" type="button">New Monster</button>
    </div>
  </header>

  <main class="stack gap-lg">
    <section class="card">
      <div class="monster-stage">
        <div id="monsterArt" class="monster-art" aria-hidden="true"></div>
        <div class="monster-stats stack gap-sm" style="gap:0.4rem">
          <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
            <h2 id="monsterName" style="margin:0;font-size:1.1rem">—</h2>
            <span id="monsterThemePill" class="pill" style="font-size:0.72rem">Theme</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem">
            <span style="font-size:0.85rem;white-space:nowrap">HP</span>
            <div class="hp-bar" style="flex:1"><div id="monsterHpFill" class="hp-fill"></div></div>
            <strong id="monsterHpText" style="font-size:0.85rem;white-space:nowrap">0 / 0</strong>
          </div>


          <div id="finalBlowPanel" class="final-blow-panel hidden"></div>
        </div>
      </div>
    </section>

    <section class="card battle-card">
      <div class="battle-layout">
        <div id="kidButtons" class="kid-grid" style="margin-top:0"></div>
        <div id="movePanel" class="stack gap-md"></div>
      </div>
    </section>

    <section class="card">
      <div class="leaderboard-header">
        <strong>Leaderboard</strong>
        <div class="leaderboard-controls">
          <div class="lb-tabs">
            <button class="lb-tab active" data-period="day">Today</button>
            <button class="lb-tab" data-period="week">Week</button>
            <button class="lb-tab" data-period="alltime">All Time</button>
          </div>
        </div>
      </div>
      <div id="leaderboard" class="leaderboard"></div>
    </section>

    <div class="bottom-reset">
      <button id="resetScoresBtn" class="ghost" type="button">Reset Scores</button>
      <button id="bottomResetBattleBtn" class="danger" type="button">Reset Battle</button>
    </div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
/* ── State ── */
const KID_DEFAULTS = [
  { id:'jj',    name:'JJ',    age:10 },
  { id:'roy5',  name:'Roy5',  age:8  },
  { id:'drey',  name:'Drey',  age:4  },
  { id:'sarge', name:'Sarge', age:4  }
];

const MOVE_DEFS = {
  attack:  { label:'Attack',  baseDamage:1, critChance:0.1,  critBonus:1, flavor:'Solid everyday win.' },
  combo:   { label:'Combo',   baseDamage:3, critChance:0.15, critBonus:2, flavor:'Big move for a bigger moment.' },
  grenade: { label:'Grenade', baseDamage:5, critChance:0.2,  critBonus:3, flavor:'An explosive throw that scorches the boss.', effect:'grenade' }
};

const THEMES = {
  morning:   { label:'Morning',   flavor:'Weak to getting ready without drama.',           hue:[35,65],   prefixes:['Snooze','Toothbrush','Pajama','Latebell','Alarm','Breakfast','Backpack','Sock'],  types:['Goblin','Troll','Hydra','Wraith','Ogre','Slime'] },
  chores:    { label:'Chores',    flavor:'Weak to ownership, cleanup, and follow-through.', hue:[170,215], prefixes:['Clutter','Dust','Trash','Sock','Laundry','Crumb','Mess','Mop'],                types:['Golem','Beast','Dragon','Troll','Slime','Ogre'] },
  kindness:  { label:'Kindness',  flavor:'Weak to sibling kindness and respectful words.',  hue:[300,340], prefixes:['Whine','Snarl','Bicker','Grumble','Sulk','Snap','Nudge','Huff'],               types:['Wraith','Goblin','Hydra','Ogre','Gremlin','Beast'] },
  listening: { label:'Listening', flavor:'Weak to first-time listening and fast obedience.',hue:[215,255], prefixes:['Stall','Delay','Nope','Mumble','Echo','Detour','Shrug','Waitasec'],            types:['Goblin','Slime','Ogre','Imp','Wraith','Troll'] }
};

const dom = {
  appTitle:         document.getElementById('appTitle'),
  monsterName:      document.getElementById('monsterName'),
  monsterArt:       document.getElementById('monsterArt'),
  monsterHpText:    document.getElementById('monsterHpText'),
  monsterHpFill:    document.getElementById('monsterHpFill'),
  monsterThemePill: document.getElementById('monsterThemePill'),
  finalBlowPanel:   document.getElementById('finalBlowPanel'),
  kidButtons:       document.getElementById('kidButtons'),
  movePanel:        document.getElementById('movePanel'),
  leaderboard:      document.getElementById('leaderboard'),
  resetScoresBtn:   document.getElementById('resetScoresBtn'),
  healMonsterBtn:   document.getElementById('healMonsterBtn'),
  resetBattleBtn:   document.getElementById('resetBattleBtn'),
  bottomResetBattleBtn: document.getElementById('bottomResetBattleBtn'),
  toast:            document.getElementById('toast')
};

const state = { game:null, selectedKidId:null, selectedMoveKey:null, toastTimer:null };

function createInitialGame(){
  return {
    title:'Boss Battle',
    monster:createMonsterSeeded(),
    kids:KID_DEFAULTS.map(k=>({...k,damage:0,monsterDamage:0,kills:0})),
    battleLog:[]
  };
}

/* ── RNG ── */
function mulberry32(a){ return ()=>{ let t=(a+=0x6D2B79F5); t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return((t^(t>>>14))>>>0)/4294967296; }; }
function pick(list,rng){ return list[Math.floor(rng()*list.length)]; }
function randRange(rng,min,max){ return min + (max-min)*rng(); }
function hsl(h,s,l){ return `hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`; }
function fmt(num){ return Number(num).toFixed(1).replace(/\.0$/, ''); }

function buildPalette(theme, rng){
  const [hueMin, hueMax]=theme.hue;
  const hue=randRange(rng,hueMin,hueMax);
  return {
    body:hsl(hue, randRange(rng,55,78), randRange(rng,48,60)),
    accent:hsl((hue + randRange(rng,-18,18) + 360) % 360, randRange(rng,72,90), randRange(rng,78,90)),
    dark:hsl((hue + randRange(rng,-10,10) + 360) % 360, randRange(rng,26,42), randRange(rng,16,24)),
    extra:hsl((hue + randRange(rng,18,42)) % 360, randRange(rng,60,86), randRange(rng,52,68)),
    shadow:hsl((hue + randRange(rng,-8,8) + 360) % 360, randRange(rng,30,44), randRange(rng,10,16))
  };
}

function createBodyPath(rng){
  const topY=fmt(randRange(rng,74,92));
  const rightShoulderX=fmt(randRange(rng,218,244));
  const leftShoulderX=fmt(320-Number(rightShoulderX));
  const bellyY=fmt(randRange(rng,184,212));
  const bottomY=fmt(randRange(rng,270,286));
  const waist=fmt(randRange(rng,48,74));
  const shoulderCurve=randRange(rng,28,50);
  return `<path d="M160 ${topY} C ${fmt(160+shoulderCurve)} ${topY}, ${rightShoulderX} ${fmt(Number(topY)+18)}, ${rightShoulderX} ${fmt(Number(topY)+62)} C ${fmt(randRange(rng,248,270))} ${bellyY}, ${fmt(160+Number(waist))} ${bottomY}, 160 ${bottomY} C ${fmt(160-Number(waist))} ${bottomY}, ${fmt(randRange(rng,50,72))} ${bellyY}, ${leftShoulderX} ${fmt(Number(topY)+62)} C ${leftShoulderX} ${fmt(Number(topY)+18)}, ${fmt(160-shoulderCurve)} ${topY}, 160 ${topY} Z"/>`;
}

function createEyes(rng,p){
  const y=fmt(randRange(rng,144,166));
  const spacing=randRange(rng,30,40);
  const left=fmt(160-spacing), right=fmt(160+spacing);
  const eyeStyle=Math.floor(rng()*4);
  if(eyeStyle===0) return `<g fill="${p.dark}"><ellipse cx="${left}" cy="${y}" rx="${fmt(randRange(rng,10,15))}" ry="${fmt(randRange(rng,8,12))}"/><ellipse cx="${right}" cy="${y}" rx="${fmt(randRange(rng,10,15))}" ry="${fmt(randRange(rng,8,12))}"/></g><g fill="${p.accent}"><circle cx="${fmt(Number(left)+randRange(rng,2,4))}" cy="${fmt(Number(y)-randRange(rng,1,3))}" r="${fmt(randRange(rng,2.5,4))}"/><circle cx="${fmt(Number(right)+randRange(rng,2,4))}" cy="${fmt(Number(y)-randRange(rng,1,3))}" r="${fmt(randRange(rng,2.5,4))}"/></g>`;
  if(eyeStyle===1) return `<g stroke="${p.dark}" stroke-width="${fmt(randRange(rng,6,10))}" stroke-linecap="round"><path d="M${fmt(Number(left)-12)} ${y} h${fmt(randRange(rng,22,34))}"/><path d="M${fmt(Number(right)-12)} ${y} h${fmt(randRange(rng,22,34))}"/></g>`;
  if(eyeStyle===2) return `<g fill="${p.dark}"><path d="M${fmt(Number(left)-14)} ${fmt(Number(y)+1)} q14 -${fmt(randRange(rng,12,18))} 28 0 q-14 ${fmt(randRange(rng,8,14))} -28 0Z"/><path d="M${fmt(Number(right)-14)} ${fmt(Number(y)+1)} q14 -${fmt(randRange(rng,12,18))} 28 0 q-14 ${fmt(randRange(rng,8,14))} -28 0Z"/></g><g fill="${p.accent}"><circle cx="${left}" cy="${fmt(Number(y)-2)}" r="${fmt(randRange(rng,2.5,4))}"/><circle cx="${right}" cy="${fmt(Number(y)-2)}" r="${fmt(randRange(rng,2.5,4))}"/></g>`;
  return `<g fill="${p.dark}" stroke="${p.accent}" stroke-width="2"><circle cx="${left}" cy="${y}" r="${fmt(randRange(rng,8,11))}"/><circle cx="${right}" cy="${y}" r="${fmt(randRange(rng,8,11))}"/></g><g fill="${p.accent}"><circle cx="${left}" cy="${y}" r="${fmt(randRange(rng,2,3.5))}"/><circle cx="${right}" cy="${y}" r="${fmt(randRange(rng,2,3.5))}"/></g>`;
}

function createMouth(rng,p){
  const y=randRange(rng,202,222);
  const width=randRange(rng,46,72);
  const style=Math.floor(rng()*4);
  if(style===0) return `<path d="M${fmt(160-width/2)} ${fmt(y)} q${fmt(width/2)} ${fmt(randRange(rng,16,28))} ${fmt(width)} 0" stroke="${p.dark}" stroke-width="${fmt(randRange(rng,7,10))}" stroke-linecap="round" fill="none"/>`;
  if(style===1) return `<ellipse cx="160" cy="${fmt(y)}" rx="${fmt(width/2)}" ry="${fmt(randRange(rng,10,18))}" fill="${p.dark}"/><path d="M${fmt(160-width/3)} ${fmt(y)} q${fmt(width/3)} ${fmt(randRange(rng,8,14))} ${fmt(2*width/3)} 0" stroke="${p.accent}" stroke-width="3" fill="none" opacity="0.55"/>`;
  if(style===2) return `<g stroke="${p.dark}" stroke-width="${fmt(randRange(rng,8,12))}" stroke-linecap="round"><path d="M${fmt(160-width/2)} ${fmt(y)} h${fmt(width)}"/><path d="M${fmt(160-width/4)} ${fmt(y+10)} h${fmt(width/2)}" opacity="0.55"/></g>`;
  return `<path d="M${fmt(160-width/2)} ${fmt(y)} c${fmt(width*0.18)} ${fmt(randRange(rng,14,20))} ${fmt(width*0.32)} ${fmt(randRange(rng,18,24))} ${fmt(width/2)} ${fmt(randRange(rng,18,24))} c${fmt(width*0.18)} 0 ${fmt(width*0.32)} -${fmt(randRange(rng,8,16))} ${fmt(width/2)} -${fmt(randRange(rng,18,24))}" stroke="${p.dark}" stroke-width="${fmt(randRange(rng,7,10))}" fill="none" stroke-linecap="round"/>`;
}

function createHorns(rng,p){
  const style=Math.floor(rng()*4);
  if(style===0) return '';
  if(style===1) return `<g fill="${p.shadow}"><path d="M118 102 c-18 -${fmt(randRange(rng,24,38))} -8 -${fmt(randRange(rng,48,64))} 12 -${fmt(randRange(rng,58,74))} c-3 20 5 35 14 48Z"/><path d="M202 102 c18 -${fmt(randRange(rng,24,38))} 8 -${fmt(randRange(rng,48,64))} -12 -${fmt(randRange(rng,58,74))} c3 20 -5 35 -14 48Z"/></g>`;
  if(style===2) return `<g stroke="${p.shadow}" stroke-width="${fmt(randRange(rng,9,13))}" stroke-linecap="round" fill="none"><path d="M118 103 c-${fmt(randRange(rng,10,20))} -${fmt(randRange(rng,22,30))} -${fmt(randRange(rng,14,26))} -${fmt(randRange(rng,42,58))} ${fmt(randRange(rng,0,10))} -${fmt(randRange(rng,62,78))}"/><path d="M202 103 c${fmt(randRange(rng,10,20))} -${fmt(randRange(rng,22,30))} ${fmt(randRange(rng,14,26))} -${fmt(randRange(rng,42,58))} -${fmt(randRange(rng,0,10))} -${fmt(randRange(rng,62,78))}"/></g>`;
  return `<g fill="${p.shadow}"><circle cx="118" cy="92" r="${fmt(randRange(rng,12,18))}"/><circle cx="202" cy="92" r="${fmt(randRange(rng,12,18))}"/></g>`;
}

function createArms(rng,p){
  const style=Math.floor(rng()*4);
  if(style===0) return '';
  const stroke=fmt(randRange(rng,9,13));
  if(style===1) return `<g stroke="${p.dark}" stroke-width="${stroke}" stroke-linecap="round" fill="none"><path d="M${fmt(randRange(rng,84,96))} ${fmt(randRange(rng,180,198))} c-${fmt(randRange(rng,20,34))} ${fmt(randRange(rng,8,18))} -${fmt(randRange(rng,30,44))} ${fmt(randRange(rng,28,40))} -${fmt(randRange(rng,36,52))} ${fmt(randRange(rng,46,58))}"/><path d="M${fmt(randRange(rng,224,236))} ${fmt(randRange(rng,180,198))} c${fmt(randRange(rng,20,34))} ${fmt(randRange(rng,8,18))} ${fmt(randRange(rng,30,44))} ${fmt(randRange(rng,28,40))} ${fmt(randRange(rng,36,52))} ${fmt(randRange(rng,46,58))}"/></g>`;
  if(style===2) return `<g stroke="${p.dark}" stroke-width="${stroke}" stroke-linecap="round" fill="none"><path d="M${fmt(randRange(rng,84,96))} ${fmt(randRange(rng,194,208))} q-${fmt(randRange(rng,28,42))} ${fmt(randRange(rng,2,12))} -${fmt(randRange(rng,50,64))} ${fmt(randRange(rng,26,40))}"/><path d="M${fmt(randRange(rng,224,236))} ${fmt(randRange(rng,194,208))} q${fmt(randRange(rng,28,42))} ${fmt(randRange(rng,2,12))} ${fmt(randRange(rng,50,64))} ${fmt(randRange(rng,26,40))}"/></g>`;
  return `<g fill="${p.shadow}"><circle cx="${fmt(randRange(rng,66,80))}" cy="${fmt(randRange(rng,198,214))}" r="${fmt(randRange(rng,11,16))}"/><circle cx="${fmt(randRange(rng,240,254))}" cy="${fmt(randRange(rng,198,214))}" r="${fmt(randRange(rng,11,16))}"/></g>`;
}

function createExtra(rng,p){
  const style=Math.floor(rng()*4);
  if(style===0){
    return `<g fill="none" stroke="${p.extra}" stroke-width="${fmt(randRange(rng,6,10))}" opacity="0.35"><ellipse cx="160" cy="176" rx="${fmt(randRange(rng,90,106))}" ry="${fmt(randRange(rng,104,118))}"/><ellipse cx="160" cy="176" rx="${fmt(randRange(rng,106,124))}" ry="${fmt(randRange(rng,120,136))}"/></g>`;
  }
  if(style===1){
    const spikes=[];
    const count=5+Math.floor(rng()*4);
    for(let i=0;i<count;i++){
      const x=90+i*(140/(count-1));
      const h=randRange(rng,18,38);
      spikes.push(`<path d="M${fmt(x)} 90 l${fmt(randRange(rng,-8,-2))} -${fmt(h)} l${fmt(randRange(rng,10,16))} ${fmt(h-4)}Z"/>`);
    }
    return `<g fill="${p.extra}" opacity="0.85">${spikes.join('')}</g>`;
  }
  if(style===2){
    const drips=[];
    const count=3+Math.floor(rng()*3);
    for(let i=0;i<count;i++){
      const x=110+i*(100/Math.max(1,count-1));
      const len=randRange(rng,18,42);
      drips.push(`<path d="M${fmt(x)} 244 q${fmt(randRange(rng,4,12))} ${fmt(len/2)} 0 ${fmt(len)} q-${fmt(randRange(rng,4,12))} -${fmt(len*0.18)} 0 -${fmt(len)}Z"/>`);
    }
    return `<g fill="${p.extra}" opacity="0.65">${drips.join('')}</g>`;
  }
  const scales=[];
  for(let row=0;row<3;row++){
    for(let col=0;col<4;col++){
      const x=112+col*26+(row%2?12:0);
      const y=182+row*22;
      scales.push(`<path d="M${x} ${y} q10 -${fmt(randRange(rng,8,14))} 20 0 q-10 ${fmt(randRange(rng,8,12))} -20 0Z"/>`);
    }
  }
  return `<g fill="${p.extra}" opacity="0.55">${scales.join('')}</g>`;
}

function buildCrackLayer(rng, count, bounds){
  const paths=[];
  for(let i=0;i<count;i++){
    let px=randRange(rng,bounds.minX,bounds.maxX);
    let py=randRange(rng,bounds.minY,bounds.maxY);
    let d=`M${fmt(px)} ${fmt(py)}`;
    const segments=3+Math.floor(rng()*3);
    for(let j=0;j<segments;j++){
      const dx=randRange(rng,-16,16);
      const dy=randRange(rng,8,18)*(j%2===0?1:-1);
      px += dx; py += dy;
      d += ` l${fmt(dx)} ${fmt(dy)}`;
    }
    paths.push(`<path d="${d}"/>`);
  }
  return paths.join('');
}

function buildSparkLayer(rng, count){
  const dots=[];
  for(let i=0;i<count;i++) dots.push(`<circle cx="${fmt(randRange(rng,112,208))}" cy="${fmt(randRange(rng,112,228))}" r="${fmt(randRange(rng,2.5,4.5))}"/>`);
  return dots.join('');
}

function buildMonsterArt(seed, themeKey){
  const theme=THEMES[themeKey] || THEMES.morning;
  const rng=mulberry32(seed ^ 0x9e3779b9);
  const palette=buildPalette(theme,rng);
  return {
    palette,
    layers:{
      body:createBodyPath(rng),
      eyes:createEyes(rng,palette),
      mouth:createMouth(rng,palette),
      horns:createHorns(rng,palette),
      arms:createArms(rng,palette),
      extra:createExtra(rng,palette)
    },
    damage:{
      light:buildCrackLayer(rng,2,{minX:116,maxX:204,minY:118,maxY:210}),
      heavy:buildCrackLayer(rng,3,{minX:108,maxX:212,minY:128,maxY:238}),
      sparks:buildSparkLayer(rng,3+Math.floor(rng()*3))
    }
  };
}

function createMonsterSeeded(seed=Math.floor(Date.now()%1000000)){
  const rng=mulberry32(seed), themeKey=pick(Object.keys(THEMES),rng), theme=THEMES[themeKey];
  const maxHp=30+Math.floor(rng()*16);
  return { seed, themeKey, name:`${pick(theme.prefixes,rng)} ${pick(theme.types,rng)}`,
    flavor:theme.flavor, maxHp, hp:maxHp, finalBlowBy:null, finalBlowAt:null,
    art:buildMonsterArt(seed, themeKey) };
}

function normalizeKids(kids=KID_DEFAULTS){
  return kids.map((kid,i)=>({ ...KID_DEFAULTS[i], ...kid, damage:Number(kid?.damage||0), monsterDamage:Number(kid?.monsterDamage||0), kills:Number(kid?.kills||0) }));
}

/* ── SVG ── */
function renderMonsterSVG(m, pct=100){
  const art=m.art || buildMonsterArt(m.seed ?? 0, m.themeKey);
  const crackColor = 'rgba(0,0,0,0.55)';
  const cracks1 = pct <= 66 ? `<g stroke="${crackColor}" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">${art.damage.light}</g>` : '';
  const cracks2 = pct <= 33 ? `<g stroke="${crackColor}" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85">${art.damage.heavy}</g>` : '';
  const stars = pct <= 33 ? `<g fill="${crackColor}" opacity="0.5">${art.damage.sparks}</g>` : '';

  return `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${m.name}">
    <ellipse cx="160" cy="288" rx="84" ry="18" fill="rgba(0,0,0,0.22)"/>
    ${art.layers.extra}${art.layers.horns}${art.layers.arms}<g fill="${art.palette.body}">${art.layers.body}</g>${art.layers.eyes}${art.layers.mouth}
    ${cracks1}${cracks2}${stars}
  </svg><div class="monster-burn-mark ${m.burned ? 'active' : ''}" aria-hidden="true"></div>`;
}

/* ── Toast ── */
function showToast(msg, tone=''){
  dom.toast.textContent=msg; dom.toast.className='toast'; if(tone) dom.toast.classList.add(tone);
  dom.toast.classList.remove('hidden');
  clearTimeout(state.toastTimer);
  state.toastTimer=setTimeout(()=>dom.toast.classList.add('hidden'),2200);
}

/* ── Helpers ── */
function getKidById(id){ return state.game?.kids?.find(k=>k.id===id)??null; }

function getMonsterLeaderIds(game=state.game){
  const kids=normalizeKids(game?.kids||[]);
  const high=Math.max(0,...kids.map(k=>Number(k.monsterDamage||0)));
  if(high<=0) return [];
  const tied=kids.filter(k=>Number(k.monsterDamage||0)===high).map(k=>k.id);
  if(tied.length===1) return tied;
  // Break tie: walk log oldest-first, whoever accumulated to `high` first wins
  const log=[...(game?.battleLog||[])].reverse();
  const running={};
  for(const entry of log){
    if(!tied.includes(entry.kidId)) continue;
    running[entry.kidId]=(running[entry.kidId]||0)+entry.damage;
    if(running[entry.kidId]>=high) return [entry.kidId];
  }
  return [tied[0]]; // fallback
}

function getMonsterLeaders(game=state.game){
  const ids=getMonsterLeaderIds(game);
  return ids.map(id=>getKidById(id)||normalizeKids(game?.kids||[]).find(k=>k.id===id)).filter(Boolean);
}

/* ── Render ── */
function renderMonster(){
  const m=state.game?.monster; if(!m||dom.monsterArt.classList.contains('is-dead')) return;
  const pct=Math.max(0,Math.min(100,(m.hp/m.maxHp)*100));
  dom.monsterName.textContent=m.name;
  dom.monsterThemePill.textContent=THEMES[m.themeKey]?.label??m.themeKey;
  dom.monsterArt.innerHTML=renderMonsterSVG(m,pct);
  dom.monsterHpText.textContent=`${m.hp} / ${m.maxHp}`;
  dom.monsterHpFill.style.width=`${pct}%`;
  dom.monsterHpFill.classList.toggle('low', pct<30);
  // Visual damage state on the art box
  dom.monsterArt.classList.toggle('hurt',  pct<=66 && pct>33);
  dom.monsterArt.classList.toggle('badly-hurt', pct<=33 && pct>0);
}

function renderFinalBlowPanel(){

  if((m.hp||0)>0){ dom.finalBlowPanel.classList.add('hidden'); dom.finalBlowPanel.innerHTML=''; return; }

  const leaders=getMonsterLeaders();

  if(m.finalBlowBy){
    const winner=getKidById(m.finalBlowBy);
    dom.finalBlowPanel.classList.remove('hidden');
    dom.finalBlowPanel.innerHTML=`<h3>${winner?.name||'A hero'} delivered the final blow.</h3>`;
    return;
  }

  dom.finalBlowPanel.classList.remove('hidden');
  dom.finalBlowPanel.innerHTML=`
    <div class="final-blow-buttons">
      ${leaders.length?leaders.map(kid=>`<button class="final-blow-btn" data-final-kid-id="${kid.id}" type="button">${kid.name} delivers final blow</button>`).join('')

    </div>`;

  dom.finalBlowPanel.querySelectorAll('[data-final-kid-id]').forEach(btn=>{
    if(!btn.dataset.finalKidId) return;
    btn.addEventListener('click',()=>deliverFinalBlow(btn.dataset.finalKidId));
  });
}

function renderKidButtons(){
  const kids=state.game?.kids??[];
  dom.kidButtons.innerHTML=kids.map(kid=>`
    <button class="kid-btn ${state.selectedKidId===kid.id?'selected':''}" data-kid-id="${kid.id}" type="button">
      <strong>${kid.name}</strong>
    </button>`).join('');
  dom.kidButtons.querySelectorAll('[data-kid-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{ state.selectedKidId=btn.dataset.kidId; state.selectedMoveKey=null; renderUI(); });
  });

function renderMovePanel(){
  const kid=getKidById(state.selectedKidId);
  const m=state.game?.monster;
  if(!kid){ dom.movePanel.innerHTML=''; return; }

  if(m?.finalBlowBy){
    const winner=getKidById(m.finalBlowBy);
    dom.movePanel.innerHTML=`<div class="card"><h3>${winner?.name||'A hero'} landed the final blow.</h3></div>`;
    return;
  }

  if((m?.hp||0)<=0){

            <span>${move.label}</span>
            <small>${move.baseDamage} base · ${Math.round(move.critChance*100)}% crit</small>

/* ── PERSISTENT STATS ── */
let activePeriod = 'day';

// In-memory stats store: { day: { '2026-3-22': { JJ: {kills,damage}, ... } }, week: {...}, alltime: {...} }
let persistedStats = { day: {}, week: {}, alltime: {} };

function sanitizeStatsBucket(stats) {
  if (!stats || typeof stats !== 'object') return {};
  return Object.fromEntries(
    Object.entries(stats).map(([name, values]) => [name, {
      kills: Number(values?.kills || 0),
      damage: Number(values?.damage || 0)
    }])
  );
}

function sanitizePersistedStats(stats) {
  const safe = { day: {}, week: {}, alltime: {} };
  if (!stats || typeof stats !== 'object') return safe;

  ['day', 'week'].forEach(period => {
    const buckets = stats[period];
    if (!buckets || typeof buckets !== 'object') return;
    safe[period] = Object.fromEntries(
      Object.entries(buckets).map(([key, value]) => [key, sanitizeStatsBucket(value)])
    );
  });

  safe.alltime = sanitizeStatsBucket(stats.alltime);
  return safe;
}

function syncSelectionState() {
  const hasSelectedKid = state.selectedKidId && getKidById(state.selectedKidId);
  if (!hasSelectedKid) {
    state.selectedKidId = null;
    state.selectedMoveKey = null;
  }

  if (state.selectedMoveKey && !MOVE_DEFS[state.selectedMoveKey]) {
    state.selectedMoveKey = null;
  }
}

function getLeaderboardStats() {
  const stats = sanitizeStatsBucket(loadPeriodStats(activePeriod));
  const currentKids = normalizeKids(state.game?.kids ?? []);
  const shouldOverlayCurrentMonster = Boolean(state.game?.monster) && !state.game.monster.finalBlowBy;

  if (shouldOverlayCurrentMonster) {
    currentKids.forEach(kid => {
      if (!stats[kid.name]) stats[kid.name] = { kills: 0, damage: 0 };
      stats[kid.name].damage += Number(kid.monsterDamage || 0);
    });
  }

  return stats;
}

function periodKey(period) {
  const now = new Date();
  if (period === 'day') return `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
  if (period === 'week') {
    const d = new Date(now); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay()+6)%7));
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }
  return 'alltime';
}

function loadPeriodStats(period) {
  if (period === 'alltime') return persistedStats.alltime || {};
  const key = periodKey(period);
  return (persistedStats[period] || {})[key] || {};
}

function savePeriodStats(period, stats) {
  if (period === 'alltime') { persistedStats.alltime = stats; autoSave(); return; }
  const key = periodKey(period);
  if (!persistedStats[period]) persistedStats[period] = {};
  persistedStats[period][key] = stats;
  autoSave();
}

/* ── AUTO SAVE / LOAD ── */
const AUTO_SAVE_KEY = 'bossbattle-autosave';

function sanitizeGame(game) {
  if (!game || typeof game !== 'object') return createInitialGame();
  const kids = normalizeKids(Array.isArray(game.kids) ? game.kids : KID_DEFAULTS);
  const monster = game.monster && typeof game.monster === 'object'
    ? { ...createMonsterSeeded(0), ...game.monster, hp: Number(game.monster.hp ?? game.monster.maxHp ?? 0), maxHp: Number(game.monster.maxHp ?? game.monster.hp ?? 0) }
    : createMonsterSeeded();
  monster.art = monster.art || buildMonsterArt(monster.seed ?? 0, monster.themeKey);
  monster.hp = Math.max(0, Math.min(monster.maxHp || 0, monster.hp || 0));
  return {
    title: typeof game.title === 'string' && game.title.trim() ? game.title : 'Boss Battle',
    monster,
    kids,
    battleLog: Array.isArray(game.battleLog) ? game.battleLog.slice(0, 24) : []
  };
}

function autoSave() {
  try {
    localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify({
      version: 2,
      stats: persistedStats,
      game: state.game,
      selectedKidId: state.selectedKidId,
      selectedMoveKey: state.selectedMoveKey,
      activePeriod,
      savedAt: new Date().toISOString()
    }));
  } catch {}
}

function autoLoad() {
  try {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    persistedStats = sanitizePersistedStats(data?.stats);
    if (data?.game) { state.game = sanitizeGame(data.game); }
    if (typeof data?.selectedKidId === 'string') { state.selectedKidId = data.selectedKidId; }
    if (typeof data?.selectedMoveKey === 'string') { state.selectedMoveKey = data.selectedMoveKey; }
    if (['day','week','alltime'].includes(data?.activePeriod)) { activePeriod = data.activePeriod; }
    syncSelectionState();
  } catch {}
}

/* ── SAVE / LOAD JSON ── */
function exportSave() {
  const saveData = {
    version: 2,
    stats: persistedStats,
    game: state.game,
    selectedKidId: state.selectedKidId,
    selectedMoveKey: state.selectedMoveKey,
    activePeriod,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const d = new Date();
  a.download = `bossbattle-save-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Progress saved!', 'success');
}

function importSave(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data?.game || !data?.stats) throw new Error('Invalid save file');
      persistedStats = sanitizePersistedStats(data?.stats);
      if (data.game) state.game = sanitizeGame(data.game);
      if (typeof data.selectedKidId === 'string') state.selectedKidId = data.selectedKidId;
      if (typeof data.selectedMoveKey === 'string') state.selectedMoveKey = data.selectedMoveKey;
      if (['day','week','alltime'].includes(data.activePeriod)) activePeriod = data.activePeriod;
      syncSelectionState();
      document.querySelectorAll('.lb-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.period === activePeriod));
      renderUI();
      showToast('Progress loaded!', 'success');
    } catch {
      showToast('Could not read that save file.', 'warning');
    }
  };
  reader.readAsText(file);
}

function recordStatsForKids(killerName, allKids) {
  ['day','week','alltime'].forEach(period => {
    const stats = loadPeriodStats(period);
    // Record kill for the finisher
    if (!stats[killerName]) stats[killerName] = { kills:0, damage:0 };
    stats[killerName].kills = (stats[killerName].kills||0) + 1;
    // Record damage for everyone who hit
    allKids.forEach(kid => {
      if ((kid.monsterDamage||0) > 0) {
        if (!stats[kid.name]) stats[kid.name] = { kills:0, damage:0 };
        stats[kid.name].damage = (stats[kid.name].damage||0) + kid.monsterDamage;
      }
    });
    savePeriodStats(period, stats);
  });
}

function renderLeaderboard() {
  const stats = getLeaderboardStats();
  const kids = KID_DEFAULTS.map(k => {
    const saved = stats[k.name] || { kills:0, damage:0 };
    return {
      name: k.name,
      kills: saved.kills || 0,
      damage: saved.damage || 0,
    };
  }).sort((a, b) => b.damage - a.damage);
  const topKills = Math.max(0, ...kids.map(k => k.kills));
  dom.leaderboard.innerHTML = kids.map(kid => `
    <div class="leaderboard-card">
      <strong>${kid.name}</strong>
      <div class="score-row">
        <span class="score-chip" title="Total damage">📊 ${kid.damage}</span>
        <span class="score-chip ${kid.kills===topKills&&topKills>0?'score-chip-kills':''}" title="Kills">💀 ${kid.kills}</span>
      </div>
    </div>`).join('');
}

function renderUI(){
  dom.appTitle.textContent=state.game?.title??'Boss Battle';
  renderMonster(); renderFinalBlowPanel(); renderKidButtons(); renderMovePanel(); renderLeaderboard();
  autoSave();
}

/* ── HIT ANIMATIONS ── */
function pulseClass(el,cls,dur){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); if(dur) setTimeout(()=>el.classList.remove(cls),dur); }

function preserveScrollPosition(renderFn){
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;
  renderFn();
  requestAnimationFrame(() => window.scrollTo(scrollX, scrollY));
}

function spawnDamageNumber(damage,wasCrit){
  const rect=dom.monsterArt.getBoundingClientRect();
  const x=rect.left+rect.width*(0.38+Math.random()*0.24);
  const y=rect.top+rect.height*(0.30+Math.random()*0.18);
  const el=document.createElement('div');
  el.className=`dmg-float ${wasCrit?'crit':'normal'}`;
  el.textContent=wasCrit?`${damage}!!`:`-${damage}`;
  el.style.left=`${x}px`; el.style.top=`${y}px`;
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove(),{once:true});
}

function spawnCritBurst(){
  const rect=dom.monsterArt.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='crit-burst';
  el.style.left=`${rect.left+rect.width/2}px`;
  el.style.top=`${rect.top+rect.height*0.42}px`;
  el.innerHTML='<span class="crit-word">CRITICAL!</span><span class="crit-sub">Hit</span>';
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove(),{once:true});
}

function spawnScreenFlash(wasCrit){
  const el=document.createElement('div');
  el.className=`screen-flash ${wasCrit?'crit':'normal'}`;
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove(),{once:true});
}

function shakeMonster(wasCrit){
  const svg=dom.monsterArt.querySelector('svg'); if(!svg) return;
  const cls=wasCrit?'do-shake-crit':'do-shake';
  svg.classList.remove('do-shake','do-shake-crit'); void svg.offsetWidth;
  svg.classList.add(cls);
  svg.addEventListener('animationend',()=>svg.classList.remove(cls),{once:true});
}

function flashMonsterArt(wasCrit){
  const cls=wasCrit?'do-flash-art-crit':'do-flash-art';
  dom.monsterArt.classList.remove('do-flash-art','do-flash-art-crit'); void dom.monsterArt.offsetWidth;
  dom.monsterArt.classList.add(cls);
  setTimeout(()=>dom.monsterArt.classList.remove(cls),480);
}

function rippleHitBtn(){
  const btn=document.getElementById('hitBtn'); if(!btn) return;
  pulseClass(btn,'do-ripple');
  btn.addEventListener('animationend',()=>btn.classList.remove('do-ripple'),{once:true});
}

function launchGrenadeProjectile(){
  const hitBtn=document.getElementById('hitBtn');
  const targetSvg=dom.monsterArt.querySelector('svg');
  if(!hitBtn || !targetSvg){
    return Promise.resolve();
  }

  const btnRect=hitBtn.getBoundingClientRect();
  const monsterRect=dom.monsterArt.getBoundingClientRect();
  const startX=btnRect.left + btnRect.width / 2;
  const startY=btnRect.top + btnRect.height / 2;
  const endX=monsterRect.left + monsterRect.width * 0.52;
  const endY=monsterRect.top + monsterRect.height * 0.52;
  const grenade=document.createElement('div');
  grenade.className='grenade-projectile';
  grenade.style.left='0px';
  grenade.style.top='0px';
  grenade.style.setProperty('--start-x', `${startX}px`);
  grenade.style.setProperty('--start-y', `${startY}px`);
  grenade.style.setProperty('--delta-x', `${endX - startX}px`);
  grenade.style.setProperty('--delta-y', `${endY - startY}px`);
  document.body.appendChild(grenade);

  return new Promise(resolve => {
    grenade.addEventListener('animationend', ()=>{
      grenade.remove();
      spawnGrenadeExplosion(endX, endY);
      resolve();
    }, {once:true});
  });
}

function spawnGrenadeExplosion(x,y){
  const blast=document.createElement('div');
  blast.className='grenade-explosion';
  blast.style.left=`${x}px`;
  blast.style.top=`${y}px`;
  document.body.appendChild(blast);
  blast.addEventListener('animationend',()=>blast.remove(),{once:true});

  for(let i=0;i<18;i++){
    const ember=document.createElement('div');
    ember.className='ember-particle';
    const angle=(i/18)*Math.PI*2 + (Math.random()-0.5)*0.35;
    const distance=24 + Math.random()*68;
    ember.style.left=`${x}px`;
    ember.style.top=`${y}px`;
    ember.style.setProperty('--tx', `${Math.cos(angle)*distance}px`);
    ember.style.setProperty('--ty', `${Math.sin(angle)*distance - 12}px`);
    ember.style.setProperty('--dur', `${650 + Math.random()*300}ms`);
    document.body.appendChild(ember);
    ember.addEventListener('animationend',()=>ember.remove(),{once:true});
  }

  const burnMark=dom.monsterArt.querySelector('.monster-burn-mark');
  if(burnMark){
    burnMark.classList.remove('active');
    void burnMark.offsetWidth;
    burnMark.classList.add('active');
  }
}

function playHitEffects(damage,wasCrit,moveKey){
  const runImpactEffects=()=>{
    spawnScreenFlash(wasCrit);
    shakeMonster(wasCrit);
    flashMonsterArt(wasCrit);
    const hpFill=document.getElementById('monsterHpFill');
    if(hpFill) pulseClass(hpFill,'do-flash',280);
    setTimeout(()=>spawnDamageNumber(damage,wasCrit),55);
    if(wasCrit) setTimeout(()=>spawnCritBurst(),110);
  };

  if(moveKey==='grenade'){
    rippleHitBtn();
    launchGrenadeProjectile().then(runImpactEffects);
    return;
  }

  rippleHitBtn();
  runImpactEffects();
}

/* ── Game logic ── */
function handleHit(){
  const kid=getKidById(state.selectedKidId);
  const move=MOVE_DEFS[state.selectedMoveKey];
  const m=state.game?.monster;
  if(!kid||!move) return;
  if(m?.finalBlowBy){ showToast('That fight is finished. Start the next monster.','warning'); return; }
  if((m?.hp||0)<=0){ showToast('Boss is down. Use the final blow button.','warning'); return; }

  const wasCrit=Math.random()<move.critChance;
  const rolledDamage=move.baseDamage+(wasCrit?move.critBonus:0);
  const damage=Math.min(rolledDamage, m.hp);
  const nextHp=Math.max(0,m.hp-damage);

  playHitEffects(damage,wasCrit,state.selectedMoveKey);

  state.game={
    ...state.game,
    monster:{...m,hp:nextHp,burned: state.selectedMoveKey==='grenade' ? true : Boolean(m.burned)},
    kids:state.game.kids.map(k=>k.id===kid.id?{...k,damage:k.damage+damage,monsterDamage:(k.monsterDamage||0)+damage}:{...k}),
    battleLog:[{kidId:kid.id,kidName:kid.name,moveKey:state.selectedMoveKey,moveLabel:move.label,damage,wasCrit,at:new Date().toISOString()},...(state.game.battleLog||[])].slice(0,24)
  };

  state.selectedKidId=null; state.selectedMoveKey=null;
  preserveScrollPosition(() => renderUI());
  if(nextHp<=0) showToast('Boss is down. Final blow is ready.','success');
}

function renderDeadMonsterSVG(m){
  const art=m.art || buildMonsterArt(m.seed ?? 0, m.themeKey);
  const p=art.palette;
  const xEyes=`<g stroke="${p.dark}" stroke-width="9" stroke-linecap="round" class="x-eyes">
    <line x1="118" y1="146" x2="138" y2="166"/><line x1="138" y1="146" x2="118" y2="166"/>
    <line x1="182" y1="146" x2="202" y2="166"/><line x1="202" y1="146" x2="182" y2="166"/>
  </g>`;
  return `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${m.name} (defeated)">
    <ellipse cx="160" cy="288" rx="84" ry="18" fill="rgba(0,0,0,0.22)"/>
    ${art.layers.extra}${art.layers.horns}${art.layers.arms}<g fill="${p.body}">${art.layers.body}</g>${xEyes}${art.layers.mouth}
  </svg>`;
}

/* ── DEATH SEQUENCE ── */
function spawnShockwave(){
  const rect=dom.monsterArt.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const size=Math.max(rect.width,rect.height)*0.6;
  for(let i=0;i<3;i++){
    const el=document.createElement('div');
    el.className='shockwave';
    el.style.cssText=`left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;animation-delay:${i*120}ms;`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove(),{once:true});
  }
}

function spawnDeathParticles(color){
  const rect=dom.monsterArt.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height*0.45;
  const colors=[color,'#fff','#ffd166','#ff6f7f','#8ef2cf','#7c8cff'];
  for(let i=0;i<32;i++){
    const angle=(i/32)*Math.PI*2+(Math.random()-0.5)*0.4;
    const speed=80+Math.random()*180;
    const tx=Math.cos(angle)*speed, ty=Math.sin(angle)*speed-60;
    const sz=6+Math.random()*14, dur=500+Math.random()*400;
    const c=colors[Math.floor(Math.random()*colors.length)];
    const el=document.createElement('div');
    el.className='burst-particle';
    el.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${c};--tx:${tx}px;--ty:${ty}px;--dur:${dur}ms;animation-delay:${Math.random()*120}ms;box-shadow:0 0 ${sz}px ${c};`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove(),{once:true});
  }
}

function spawnDeathStamp(){
  const rect=dom.monsterArt.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='death-stamp';
  el.textContent='DEFEATED';
  el.style.left=`${rect.left+rect.width/2}px`;
  el.style.top=`${rect.top+rect.height/2}px`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

function spawnVignette(dur){

  el.className='death-vignette';
  document.body.appendChild(el);

}

      <h2>${m?.name??'The boss'} has fallen!</h2>

    state.game={
      ...state.game,
      monster:createMonsterSeeded(),
      kids:normalizeKids(state.game?.kids??KID_DEFAULTS).map(k=>({...k,monsterDamage:0})),
      battleLog:[]
    };
    state.selectedKidId=null; state.selectedMoveKey=null;
    dom.monsterArt.classList.remove('is-dead','hurt','badly-hurt');
    renderUI();
  });
}

function spawnTapToContinue(kid){
  const el=document.createElement('div');
  el.className='tap-continue';
  el.innerHTML='<span>Tap to continue</span>';
  document.body.appendChild(el);
  el.addEventListener('click',()=>{ el.remove(); showVictoryModal(kid); },{once:true});
}

function playDeathSequence(kid){
  const color=state.game?.monster?.art?.palette?.body??'#7c8cff';
  // 1. Swap to X eyes immediately
  dom.monsterArt.classList.add('is-dead');
  dom.monsterArt.innerHTML=renderDeadMonsterSVG(state.game.monster);
  // 2. Big screen flash
  const flash=document.createElement('div');
  flash.style.cssText='position:fixed;inset:0;background:white;z-index:250;pointer-events:none;animation:sFlash 300ms ease forwards;';
  document.body.appendChild(flash);
  flash.addEventListener('animationend',()=>flash.remove(),{once:true});
  // 3. Timed sequence
  const seq=[
    [80,  ()=>spawnShockwave()],
    [160, ()=>spawnDeathParticles(color)],
    [260, ()=>spawnVignette(1500)],
    [420, ()=>spawnDeathStamp()],
    [900, ()=>spawnTapToContinue(kid)],
  ];
  seq.forEach(([t,fn])=>setTimeout(fn,t));
}

function deliverFinalBlow(kidId){
  const kid=getKidById(kidId); if(!kid) return;
  const m=state.game?.monster;
  if((m?.hp||0)>0){ showToast('The boss is not down yet.','warning'); return; }
  if(m?.finalBlowBy){ showToast('Final blow already delivered.','warning'); return; }
  const leaderIds=getMonsterLeaderIds();
  if(!leaderIds.includes(kidId)){ showToast('That kid did not lead on this monster.','warning'); return; }

  state.game={
    ...state.game,
    monster:{...m,finalBlowBy:kidId,finalBlowAt:new Date().toISOString()},
    kids:state.game.kids.map(k=>k.id===kidId?{...k,kills:(k.kills||0)+1}:{...k})
  };
  recordStatsForKids(kid.name, state.game.kids);
  renderUI();
  const w = getKidById(kidId);
  showToast(`${w?.name || 'A hero'} delivered the final blow!`, 'success');
  playDeathSequence(kid);
}

function healMonster(amount=5){
  const m=state.game?.monster; if(!m) return;
  if(m.finalBlowBy){ showToast('That fight is finished. Spawn a new monster.','warning'); return; }
  state.game={...state.game,monster:{...m,hp:Math.min(m.maxHp,m.hp+amount)}};
  renderUI(); showToast(`Boss healed for ${amount}.`);
}

function resetBattle(){
  state.game = {
    ...state.game,
    monster: createMonsterSeeded(),
    kids: normalizeKids(state.game?.kids ?? KID_DEFAULTS).map(k => ({...k, monsterDamage: 0})),
    battleLog: []
  };
  state.selectedKidId = null;
  state.selectedMoveKey = null;
  dom.monsterArt.classList.remove('is-dead','hurt','badly-hurt');
  renderUI();
}

function resetScores(){
  persistedStats = { day: {}, week: {}, alltime: {} };
  if (state.game) {
    state.game = {
      ...state.game,
      kids: normalizeKids(state.game.kids ?? KID_DEFAULTS).map(kid => ({
        ...kid,
        damage: 0,
        monsterDamage: 0,
        kills: 0
      })),
      battleLog: []
    };
  }
  state.selectedKidId = null;
  state.selectedMoveKey = null;
  renderUI();
  showToast('Scores reset.', 'success');
}

/* ── Boot ── */
dom.healMonsterBtn.addEventListener('click',()=>healMonster(5));
document.getElementById('saveBtn').addEventListener('click', exportSave);
document.getElementById('loadInput').addEventListener('change', e => {
  if (e.target.files[0]) { importSave(e.target.files[0]); e.target.value = ''; }
});
document.querySelectorAll('.lb-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    activePeriod = btn.dataset.period;
    document.querySelectorAll('.lb-tab').forEach(b => b.classList.toggle('active', b===btn));
    renderLeaderboard();
  });
});
dom.resetBattleBtn.addEventListener('click', resetBattle);
dom.bottomResetBattleBtn.addEventListener('click', resetBattle);
dom.resetScoresBtn.addEventListener('click', resetScores);

state.game = createInitialGame();
autoLoad();
document.querySelectorAll('.lb-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.period === activePeriod));
renderUI();
</script>
</body>
</html>
