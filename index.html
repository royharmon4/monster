<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Boss Battle — Preview v3</title>
    <link rel="stylesheet" href="/css/styles.css" />

</head>
<body>
<div id="app" class="shell">
  <header class="topbar">
    <h1 id="appTitle">Boss Battle</h1>
    <div class="topbar-actions">
      <button id="saveBtn" class="ghost" type="button" title="Save progress to file">💾 Save</button>
      <label class="ghost load-label-inline" title="Load progress from file">📂 Load<input id="loadInput" type="file" accept=".json" class="load-input-hidden"/></label>
      <button id="healMonsterBtn" class="ghost" type="button">+5 HP</button>
      <button id="resetBattleBtn" class="danger" type="button">New Monster</button>
    </div>
  </header>

  <main class="stack gap-lg">
    <section class="card">
      <div class="monster-stage">
        <div id="monsterArt" class="monster-art" aria-hidden="true"></div>
        <div class="monster-stats stack gap-sm monster-stats-tight">
          <div class="monster-name-row-inline">
            <h2 id="monsterName" class="monster-name-inline">—</h2>
            <span id="monsterThemePill" class="pill monster-theme-pill-inline">Theme</span>
          </div>
          <div class="monster-hp-row-inline">
            <span class="monster-hp-label-inline">HP</span>
            <div class="hp-bar monster-hp-bar-flex"><div id="monsterHpFill" class="hp-fill"></div></div>
            <strong id="monsterHpText" class="monster-hp-text-inline">0 / 0</strong>
          </div>


          <div id="finalBlowPanel" class="final-blow-panel hidden"></div>
        </div>
      </div>
    </section>

    <section class="card battle-card">
      <div class="battle-layout">
        <div id="kidButtons" class="kid-grid kid-grid-no-margin"></div>
        <div id="movePanel" class="stack gap-md"></div>
      </div>
    </section>

    <section class="card">
      <div class="leaderboard-header">
        <strong>Leaderboard</strong>
        <div class="leaderboard-controls">
          <div class="lb-tabs">
            <button class="lb-tab active" data-period="day">Today</button>
            <button class="lb-tab" data-period="week">Week</button>
            <button class="lb-tab" data-period="alltime">All Time</button>
          </div>
        </div>
      </div>
      <div id="leaderboard" class="leaderboard"></div>
    </section>

    <div class="bottom-reset">
      <button id="resetScoresBtn" class="ghost" type="button">Reset Scores</button>
      <button id="bottomResetBattleBtn" class="danger" type="button">Reset Battle</button>
    </div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="/js/main.js"></script>

</body>
</html>
